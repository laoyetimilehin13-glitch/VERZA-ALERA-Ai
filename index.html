<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>VERZA-ALERA AI | Intelligent Data for Intelligent Machines</title>

<meta name="description"
content="VERZA-ALERA AI provides intelligent data annotation, AI training data, dataset management and quality review tools.">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#050811;
  --bg2:#080d18;
  --panel:#0c1322;
  --panel2:#101a2c;
  --line:rgba(255,255,255,.09);
  --text:#f4f7ff;
  --muted:#8996ad;
  --blue:#5b8cff;
  --cyan:#26d9ff;
  --purple:#8a63ff;
  --green:#43e6a1;
  --danger:#ff687d;
  --shadow:0 25px 80px rgba(0,0,0,.35);
}

*{box-sizing:border-box}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 80% -10%,rgba(79,116,255,.20),transparent 30%),
    radial-gradient(circle at 10% 30%,rgba(39,214,255,.08),transparent 25%),
    var(--bg);
  min-height:100vh;
}

button,input,select,textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   GLOBAL
========================= */

.container{
  width:min(1180px,calc(100% - 40px));
  margin:auto;
}

.hidden{
  display:none!important;
}

.muted{
  color:var(--muted);
}

.eyebrow{
  color:#7fa8ff;
  font-size:11px;
  font-weight:800;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.gradient-text{
  background:linear-gradient(90deg,#fff,#7db8ff,#62e5ff);
  -webkit-background-clip:text;
  color:transparent;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 17px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  font-weight:750;
  transition:.2s;
}

.btn:hover{
  transform:translateY(-2px);
}

.btn-primary{
  color:white;
  background:linear-gradient(135deg,var(--purple),var(--blue),var(--cyan));
  box-shadow:0 12px 35px rgba(91,140,255,.20);
}

.btn-secondary{
  color:#eaf0ff;
  background:#121b2d;
  border:1px solid var(--line);
}

.btn-danger{
  color:#ff9baa;
  background:rgba(255,70,100,.08);
  border:1px solid rgba(255,70,100,.18);
}

.card{
  background:linear-gradient(145deg,rgba(16,25,42,.95),rgba(8,13,24,.95));
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
}

/* =========================
   MARKETING SITE
========================= */

.site{
  min-height:100vh;
}

.navbar{
  position:sticky;
  top:0;
  z-index:50;
  background:rgba(5,8,17,.72);
  backdrop-filter:blur(18px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.nav-inner{
  height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.logo{
  width:43px;
  height:43px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:13px;
  font-weight:950;
  background:linear-gradient(135deg,var(--purple),var(--blue),var(--cyan));
  box-shadow:0 8px 30px rgba(70,120,255,.25);
}

.brand-name{
  font-size:14px;
  font-weight:900;
  letter-spacing:.02em;
}

.brand-sub{
  color:#70809d;
  font-size:10px;
  margin-top:2px;
}

.nav-links{
  display:flex;
  gap:27px;
  color:#9aa7bd;
  font-size:13px;
}

.nav-links a:hover{
  color:white;
}

.nav-actions{
  display:flex;
  gap:9px;
}

.mobile-menu{
  display:none;
}

.hero{
  padding:100px 0 75px;
  position:relative;
  overflow:hidden;
}

.hero:before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
  background-size:55px 55px;
  mask-image:linear-gradient(to bottom,black,transparent);
}

.hero-grid{
  display:grid;
  grid-template-columns:1.05fr .95fr;
  gap:55px;
  align-items:center;
  position:relative;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border:1px solid rgba(92,157,255,.2);
  background:rgba(69,115,255,.08);
  color:#9ec3ff;
  border-radius:999px;
  font-size:11px;
  font-weight:750;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.hero h1{
  font-size:clamp(46px,6vw,76px);
  line-height:.98;
  letter-spacing:-.05em;
  margin:22px 0;
}

.hero p{
  color:#8c99b0;
  font-size:16px;
  line-height:1.8;
  max-width:620px;
}

.hero-buttons{
  display:flex;
  gap:12px;
  margin-top:30px;
  flex-wrap:wrap;
}

.hero-visual{
  min-height:500px;
  position:relative;
  display:grid;
  place-items:center;
}

.orbit{
  width:390px;
  height:390px;
  border-radius:50%;
  border:1px solid rgba(89,139,255,.18);
  position:relative;
  display:grid;
  place-items:center;
  box-shadow:0 0 120px rgba(56,111,255,.12);
}

.orbit:before,
.orbit:after{
  content:"";
  position:absolute;
  border:1px solid rgba(90,210,255,.12);
  border-radius:50%;
}

.orbit:before{
  width:290px;
  height:290px;
}

.orbit:after{
  width:470px;
  height:470px;
}

.core{
  width:125px;
  height:125px;
  border-radius:34px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,#1d2f58,#0e1729);
  border:1px solid #416ba9;
  box-shadow:0 0 70px rgba(62,151,255,.28);
  font-weight:950;
  font-size:28px;
}

.float-card{
  position:absolute;
  background:rgba(12,19,33,.9);
  backdrop-filter:blur(15px);
  border:1px solid var(--line);
  border-radius:15px;
  padding:13px 15px;
  box-shadow:var(--shadow);
}

.float-card small{
  display:block;
  color:#73819a;
  font-size:10px;
  margin-bottom:4px;
}

.float-card b{
  font-size:17px;
}

.float-one{top:50px;right:0}
.float-two{bottom:65px;left:0}
.float-three{top:45%;right:-20px}

.metrics{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:20px 0;
}

.metric{
  text-align:center;
  border-right:1px solid var(--line);
}

.metric:last-child{
  border:0;
}

.metric b{
  font-size:27px;
}

.metric span{
  display:block;
  color:#6f7e97;
  font-size:11px;
  margin-top:4px;
}

.section{
  padding:90px 0;
}

.section-title{
  max-width:700px;
  margin-bottom:38px;
}

.section-title h2{
  font-size:42px;
  letter-spacing:-.04em;
  margin:12px 0;
}

.section-title p{
  color:#8795ad;
  line-height:1.7;
}

.feature-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:16px;
}

.feature{
  padding:25px;
  min-height:215px;
  transition:.25s;
}

.feature:hover{
  transform:translateY(-5px);
  border-color:rgba(100,150,255,.3);
}

.feature-icon{
  width:45px;
  height:45px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:rgba(81,121,255,.11);
  color:#79b7ff;
  font-size:21px;
}

.feature h3{
  margin:18px 0 8px;
}

.feature p{
  color:#77859e;
  line-height:1.65;
  font-size:13px;
}

.cta{
  padding:60px;
  text-align:center;
  position:relative;
  overflow:hidden;
}

.cta h2{
  font-size:42px;
  margin:8px 0 14px;
}

.cta p{
  color:#8794aa;
  max-width:600px;
  margin:0 auto 25px;
  line-height:1.7;
}

footer{
  border-top:1px solid var(--line);
  padding:35px 0;
  color:#69778f;
  font-size:12px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px;
}

/* =========================
   AUTH
========================= */

.auth-page{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:25px;
  background:
    radial-gradient(circle at 50% 0%,rgba(82,113,255,.18),transparent 40%),
    var(--bg);
}

.auth-card{
  width:min(470px,100%);
  padding:35px;
}

.auth-top{
  margin-bottom:28px;
}

.auth-card h1{
  font-size:31px;
  margin:25px 0 8px;
}

.auth-card p{
  color:#7e8ba3;
  line-height:1.6;
  font-size:13px;
}

.form{
  display:grid;
  gap:13px;
}

.input{
  width:100%;
  padding:14px;
  border-radius:12px;
  color:white;
  background:#080d17;
  border:1px solid #25314a;
  outline:none;
}

.input:focus{
  border-color:#507cff;
  box-shadow:0 0 0 3px rgba(80,124,255,.08);
}

.form .btn{
  width:100%;
}

.auth-switch{
  background:none;
  border:0;
  color:#79a6ff;
  margin-top:18px;
}

.notice{
  padding:12px 14px;
  border-radius:12px;
  margin:14px 0;
  background:#101a2d;
  border:1px solid rgba(100,140,255,.12);
  color:#aab8d0;
  font-size:12px;
  line-height:1.5;
}

/* =========================
   APPLICATION
========================= */

.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:250px 1fr;
}

.sidebar{
  height:100vh;
  position:sticky;
  top:0;
  padding:20px 13px;
  background:#070b14;
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  z-index:30;
}

.sidebar-brand{
  padding:3px 10px 25px;
}

.workspace{
  padding:13px;
  border:1px solid var(--line);
  background:#0b111e;
  border-radius:13px;
  margin-bottom:18px;
}

.workspace small{
  display:block;
  color:#697790;
  font-size:9px;
  letter-spacing:.15em;
  margin-bottom:7px;
}

.workspace select{
  width:100%;
  color:white;
  background:#0c1321;
  border:1px solid #25314a;
  padding:9px;
  border-radius:9px;
}

.nav{
  display:grid;
  gap:4px;
}

.nav button{
  background:none;
  border:0;
  color:#77859d;
  text-align:left;
  padding:11px 12px;
  border-radius:10px;
  transition:.2s;
}

.nav button:hover,
.nav button.active{
  background:#111b2d;
  color:white;
}

.sidebar-bottom{
  margin-top:auto;
  display:grid;
  gap:10px;
}

.secure{
  color:#58667e;
  font-size:10px;
  padding:8px;
}

.logout{
  width:100%;
}

.main{
  min-width:0;
  padding:25px 35px 60px;
}

.topbar{
  min-height:55px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
  margin-bottom:25px;
}

.topbar-title h2{
  margin:3px 0;
  font-size:23px;
}

.top-actions{
  display:flex;
  gap:9px;
  align-items:center;
}

.search{
  width:210px;
}

.avatar{
  width:39px;
  height:39px;
  border-radius:12px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#7b5cff,#2ddcff);
  font-size:12px;
  font-weight:900;
}

.page{
  animation:fade .25s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(5px)}
  to{opacity:1;transform:none}
}

.dashboard-hero{
  padding:35px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  overflow:hidden;
  position:relative;
}

.dashboard-hero h1{
  font-size:42px;
  letter-spacing:-.04em;
  margin:10px 0;
}

.dashboard-hero p{
  color:#8290a8;
  max-width:600px;
  line-height:1.7;
}

.dashboard-glow{
  width:240px;
  height:240px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(80,153,255,.3),transparent 65%);
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:13px;
  margin:15px 0 28px;
}

.stat{
  padding:20px;
}

.stat-top{
  display:flex;
  justify-content:space-between;
  color:#75839c;
  font-size:11px;
}

.stat b{
  display:block;
  font-size:29px;
  margin-top:13px;
}

.stat small{
  color:#52dca4;
  font-size:10px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}

.project-card{
  padding:20px;
  min-height:180px;
  transition:.2s;
  cursor:pointer;
}

.project-card:hover{
  transform:translateY(-3px);
  border-color:rgba(90,140,255,.3);
}

.project-icon{
  width:38px;
  height:38px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:#142038;
  color:#78b7ff;
  margin-bottom:18px;
}

.project-card h3{
  margin:0 0 7px;
}

.project-card p{
  color:#70809a;
  font-size:12px;
}

.project-meta{
  display:flex;
  gap:13px;
  color:#71809a;
  font-size:10px;
  margin-top:18px;
}

.page-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:18px;
}

.page-head h1{
  margin:5px 0;
  font-size:28px;
}

.toolbar{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
}

.panel{
  padding:19px;
  margin-bottom:15px;
}

.panel-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.panel-title h3{
  margin:0;
}

.empty{
  padding:50px 20px;
  text-align:center;
  border:1px dashed #2a3955;
  border-radius:15px;
  color:#687792;
}

.image-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}

.image-card{
  border:1px solid var(--line);
  background:#080e18;
  border-radius:14px;
  overflow:hidden;
  cursor:pointer;
}

.image-card img{
  width:100%;
  height:150px;
  object-fit:cover;
  display:block;
}

.image-info{
  padding:11px;
}

.image-info b{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.image-info span{
  color:#687791;
  font-size:10px;
}

/* annotation */

.annotation-layout{
  display:grid;
  grid-template-columns:1fr 300px;
  gap:15px;
}

.canvas{
  min-height:540px;
  background:#03060b;
  border-radius:15px;
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
  display:grid;
  place-items:center;
}

.canvas img{
  max-width:100%;
  max-height:70vh;
  display:block;
  user-select:none;
}

.annotation-box{
  position:absolute;
  border:2px solid #4fbaff;
  background:rgba(79,186,255,.08);
}

.annotation-box span{
  position:absolute;
  left:-2px;
  top:-23px;
  background:#4fbaff;
  color:#04101a;
  font-size:10px;
  font-weight:900;
  padding:4px 7px;
  border-radius:5px;
}

.annotation-list{
  display:grid;
  gap:8px;
}

.annotation-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  background:#101929;
  border-radius:10px;
  padding:10px;
  font-size:11px;
}

.progress{
  height:7px;
  background:#192237;
  border-radius:20px;
  overflow:hidden;
}

.progress span{
  display:block;
  height:100%;
  background:linear-gradient(90deg,var(--purple),var(--cyan));
  border-radius:20px;
}

/* tables */

.table{
  width:100%;
  border-collapse:collapse;
}

.table th,
.table td{
  padding:13px 10px;
  text-align:left;
  border-bottom:1px solid var(--line);
  font-size:12px;
}

.table th{
  color:#687791;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.08em;
}

.badge{
  padding:5px 8px;
  border-radius:999px;
  background:#152039;
  color:#8db6ff;
  font-size:9px;
  font-weight:800;
}

.export-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.export-card{
  padding:20px;
}

.export-card h3{
  margin:15px 0 5px;
}

.export-card p{
  color:#71809a;
  font-size:11px;
  line-height:1.6;
}

.ai-panel{
  padding:40px;
  max-width:800px;
}

.ai-icon{
  width:60px;
  height:60px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#745dff,#32d8ff);
  font-size:25px;
}

.team-form{
  display:flex;
  gap:9px;
  margin-bottom:20px;
}

.team-form .input{
  flex:1;
}

.timeline{
  display:grid;
}

.timeline-item{
  padding:17px 0 17px 22px;
  border-left:1px solid #293750;
  position:relative;
}

.timeline-item:before{
  content:"";
  position:absolute;
  width:7px;
  height:7px;
  border-radius:50%;
  background:#6ca8ff;
  left:-4px;
  top:23px;
}

.timeline-item b{
  font-size:12px;
}

.timeline-item span{
  display:block;
  color:#6f7d96;
  font-size:10px;
  margin-top:5px;
}

.settings-grid{
  display:grid;
  gap:15px;
  max-width:800px;
}

.setting{
  padding:22px;
}

.setting h3{
  margin-top:0;
}

.setting p{
  color:#78869e;
  font-size:12px;
}

/* =========================
   CHATBOT
========================= */

.chat-button{
  position:fixed;
  right:22px;
  bottom:85px;
  width:54px;
  height:54px;
  border:0;
  border-radius:18px;
  background:linear-gradient(135deg,#755dff,#29d7ff);
  color:white;
  font-size:22px;
  box-shadow:0 15px 40px rgba(60,120,255,.3);
  z-index:100;
}

.chat-window{
  position:fixed;
  right:22px;
  bottom:150px;
  width:350px;
  max-width:calc(100vw - 30px);
  background:#0b1220;
  border:1px solid #263650;
  border-radius:20px;
  box-shadow:0 25px 80px rgba(0,0,0,.55);
  overflow:hidden;
  z-index:99;
}

.chat-header{
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#101a2d;
  border-bottom:1px solid var(--line);
}

.chat-title{
  display:flex;
  gap:10px;
  align-items:center;
}

.bot-avatar{
  width:36px;
  height:36px;
  border-radius:11px;
  display:grid;
  place-items:center;
  background:linear-gradient(135deg,#745dff,#29d7ff);
}

.chat-messages{
  height:290px;
  overflow:auto;
  padding:14px;
  display:grid;
  align-content:start;
  gap:10px;
}

.message{
  max-width:85%;
  padding:10px 12px;
  border-radius:12px;
  font-size:11px;
  line-height:1.5;
}

.message.bot{
  background:#131e31;
  color:#b4c0d4;
}

.message.user{
  margin-left:auto;
  background:#365ebc;
  color:white;
}

.chat-input{
  display:flex;
  padding:10px;
  gap:7px;
  border-top:1px solid var(--line);
}

.chat-input input{
  flex:1;
  min-width:0;
  background:#080e19;
  border:1px solid #25314a;
  color:white;
  border-radius:10px;

function showAuth(mode='login'){

  $('root').innerHTML=`

    <div class="auth-page">

      <div class="card auth-card">

        <div class="auth-top">

          <a class="brand" href="#" onclick="showMarketing();return false">
            <div class="logo">VA</div>
            <div>
              <div class="brand-name">VERZA-ALERA AI</div>
              <div class="brand-sub">AI DATA CLOUD</div>
            </div>
          </a>

          <h1 id="authTitle">
            ${mode==='login'
              ? 'Welcome back'
              : 'Create your workspace'}
          </h1>

          <p>
            ${mode==='login'
              ? 'Sign in to continue to your AI data workspace.'
              : 'Create an account and start building your data workflow.'}
          </p>

        </div>

        <form class="form" onsubmit="submitAuth(event,'${mode}')">

          ${mode==='signup'
            ? `<input class="input" id="authName"
                 placeholder="Full name" required>`
            : ''}

          <input class="input"
            id="authEmail"
            type="email"
            placeholder="Email address"
            required>

          <input class="input"
            id="authPassword"
            type="password"
            minlength="6"
            placeholder="Password"
            required>

          <button class="btn btn-primary" id="authButton">
            ${mode==='login'
              ? 'Sign in'
              : 'Create account'}
          </button>

        </form>

        <div id="authMessage"></div>

        <button class="auth-switch"
          onclick="showAuth('${mode==='login'?'signup':'login'}')">

          ${mode==='login'
            ? 'Need an account? Create one'
            : 'Already have an account? Sign in'}

        </button>

      </div>

    </div>

  `;
}

async function submitAuth(event,mode){

  event.preventDefault();

  const button=$('authButton');
  button.disabled=true;
  button.textContent='Working…';

  const email=$('authEmail').value.trim();
  const password=$('authPassword').value;

  let result;

  if(mode==='login'){

    result=await db.auth.signInWithPassword({
      email,
      password
    });

  }else{

    const name=$('authName').value.trim();

    result=await db.auth.signUp({
      email,
      password,
      options:{
        data:{
          full_name:name
        },
        emailRedirectTo:
          window.location.origin + window.location.pathname
      }
    });

  }

  button.disabled=false;
  button.textContent=mode==='login'
    ? 'Sign in'
    : 'Create account';

  if(result.error){

    $('authMessage').innerHTML=
      `<div class="notice">${result.error.message}</div>`;

    return;
  }

  if(mode==='signup' && !result.data.session){

    $('authMessage').innerHTML=
      `<div class="notice">
        Account created. Please check your email and
        click the verification link before signing in.
      </div>`;

    return;
  }

  toast('Authentication successful.');
}

async function loadWorkspace(){

  const orgResult=await db
    .from('organizations')
    .select('*')
    .order('created_at');

  if(orgResult.error){
    toast(orgResult.error.message);
    return;
  }

  organizations=orgResult.data || [];

  if(!organization && organizations.length){
    organization=organizations[0];
  }

  const select=$('workspaceSelect');

  if(select){

    select.innerHTML=organizations
      .map(o=>`
        <option value="${o.id}"
          ${organization?.id===o.id?'selected':''}>
          ${o.name}
        </option>
      `).join('');
  }

  if(!organization) return;

  const result=await db
    .from('projects')
    .select('*')
    .eq('organization_id',organization.id)
    .order('created_at',{ascending:false});

  if(result.error){
    toast(result.error.message);
    return;
  }

  projects=result.data || [];

  if(!activeProject && projects.length){
    activeProject=projects[0];
  }

  if(activeProject){
    await loadImages(activeProject.id);
  }
}

async function switchWorkspace(id){

  organization=
    organizations.find(o=>o.id===id) || null;

  activeProject=null;

  await loadWorkspace();
  renderPage();
}

async function loadImages(projectId){

  const result=await db
    .from('images')
    .select('*,tasks(*),annotations(*)')
    .eq('project_id',projectId)
    .order('created_at');

  if(result.error){
    projectImages=[];
    return;
  }

  projectImages=result.data || [];

  for(const image of projectImages){

    if(image.storage_path){

      const signed=await db
        .storage
        .from('project-images')
        .createSignedUrl(
          image.storage_path,
          3600
        );

      image.url=signed.data?.signedUrl || '';
    }
  }

async function uploadImages(event){

  if(!activeProject || !organization) return;

  const files=[...event.target.files];

  for(const file of files){

    const path=
      `${activeProject.id}/${uuid()}-${escapeName(file.name)}`;

    const upload=await db
      .storage
      .from('project-images')
      .upload(path,file,{
        contentType:file.type
      });

    if(upload.error){
      toast(upload.error.message);
      continue;
    }

    const image=await db
      .from('images')
      .insert({
        project_id:activeProject.id,
        file_name:file.name,
        storage_path:path,
        created_by:session.user.id
      })
      .select()
      .single();

    if(image.error){
      toast(image.error.message);
      continue;
    }

    await db
      .from('tasks')
      .insert({
        image_id:image.data.id,
        project_id:activeProject.id
      });

    await db
      .from('usage_events')
      .insert({
        organization_id:organization.id,
        user_id:session.user.id,
        event_type:'image_uploaded',
        quantity:1,
        metadata:{file:file.name}
      });

  }

  await loadImages(activeProject.id);

  toast('Images uploaded.');
  renderPage();
}

function setupAnnotationCanvas(){

  const canvas=$('annotationCanvas');

  if(!canvas) return;

  let drawing=false;
  let startX=0;
  let startY=0;

  canvas.onpointerdown=e=>{

    if(e.target.tagName==='IMG'){
      drawing=true;

      const rect=canvas.getBoundingClientRect();

      startX=e.clientX-rect.left;
      startY=e.clientY-rect.top;
    }
  };

  canvas.onpointermove=e=>{

    if(!drawing) return;

    let box=document.getElementById('drawingBox');

    if(!box){

      box=document.createElement('div');

      box.id='drawingBox';
      box.className='annotation-box';

      canvas.appendChild(box);
    }

    const rect=canvas.getBoundingClientRect();

    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    box.style.left=Math.min(startX,x)+'px';
    box.style.top=Math.min(startY,y)+'px';

    box.style.width=Math.abs(x-startX)+'px';
    box.style.height=Math.abs(y-startY)+'px';
  };

  canvas.onpointerup=e=>{

    if(!drawing) return;

    drawing=false;

    const box=$('drawingBox');

    if(!box) return;

    const rect=canvas.getBoundingClientRect();

    const x=e.clientX-rect.left;
    const y=e.clientY-rect.top;

    const left=Math.min(startX,x);
    const top=Math.min(startY,y);
    const width=Math.abs(x-startX);
    const height=Math.abs(y-startY);

    if(width<5 || height<5){
      box.remove();
      return;
    }

    box.remove();

    createAnnotationBox(
      left,
      top,
      width,
      height,
      window.currentLabel || 'other'
    );
  };
}

function createAnnotationBox(x,y,w,h,label){

  const canvas=$('annotationCanvas');

  const box=document.createElement('div');

  box.className='annotation-box';

  box.style.left=x+'px';
  box.style.top=y+'px';
  box.style.width=w+'px';
  box.style.height=h+'px';

  box.innerHTML=
    `<span>${label}</span>`;

  canvas.appendChild(box);

  window.pendingAnnotations=
    window.pendingAnnotations || [];

  window.pendingAnnotations.push({
    label,
    x,
    y,
    w,
    h
  });

  toast('Annotation added.');
}

async function saveAnnotation(){

      .from('annotations')

        image_id:selectedImage.id,

        y:a.y,

  window.pendingAnnotations=[];

  await loadImages(activeProject.id);

  selectedImage=
    projectImages.find(i=>i.id===selectedImage.id);

    'annotation.created',

}

async function exportDataset(format){

  if(!activeProject){
    toast('Select a project first.');
    return;
  }

  const result=await db
    .from('images')
    .select('*,annotations(*)')
    .eq('project_id',activeProject.id);

  if(result.error){
    toast(result.error.message);
    return;
  }

  const images=result.data || [];

  let payload='';
  let extension=format;

  if(format==='json'){

    payload=JSON.stringify({
      project:activeProject,
      images
    },null,2);

    extension='json';

  }else if(format==='csv'){

    const rows=[
      'image,label,x,y,w,h,source,confidence'
    ];

    images.forEach(image=>{
      (image.annotations || []).forEach(a=>{
        rows.push([
          `"${String(image.file_name).replace(/"/g,'""')}"`,
          a.label,
          a.x,
          a.y,
          a.w,
          a.h,
          a.source,
          a.confidence ?? ''
        ].join(','));
      });
    });

    payload=rows.join('\n');
    extension='csv';

  }else if(format==='yolo'){

    payload=images.flatMap(image=>
      (image.annotations || []).map(a=>{

        const cx=
          Number(a.x)+Number(a.w)/2;

        const cy=
          Number(a.y)+Number(a.h)/2;

        const cls=Math.max(
          0,
          (activeProject.labels || [])
            .indexOf(a.label)
        );

        return `${cls} ${cx} ${cy} ${a.w} ${a.h}`;
      })
    ).join('\n');

    extension='txt';

  }else{

    payload=JSON.stringify({
      info:{
        description:activeProject.name
      },
      categories:(activeProject.labels || [])
        .map((name,id)=>({
          id:id+1,
          name
        })),
      images:images.map((image,id)=>({
        id:id+1,
        file_name:image.file_name
      })),
      annotations:images.flatMap((image,imageId)=>
        (image.annotations || []).map((a,id)=>({
          id:id+1,
          image_id:imageId+1,
          category_id:
            (activeProject.labels || [])
              .indexOf(a.label)+1,
          bbox:[
            a.x,
            a.y,
            a.w,
            a.h
          ]
        }))
      )
    },null,2);

    extension='json';
  }

  const blob=new Blob(
    [payload],
    {type:'text/plain'}
  );

  const link=document.createElement('a');

  link.href=URL.createObjectURL(blob);

  link.download=
    `${escapeName(activeProject.name)}.${extension}`;

  link.click();

  URL.revokeObjectURL(link.href);

  await audit(
    'dataset.exported',
    'project',
    activeProject.id,
    {format}
  );

  toast(`${format.toUpperCase()} dataset exported.`);
}

async function inviteTeamMember(){

  const email = $('inviteEmail')?.value.trim().toLowerCase();
  const role = $('inviteRole')?.value || 'annotator';
  const button = $('inviteButton');
  const status = $('inviteStatus');

  if(!email){
    toast('Enter an email address.');
    $('inviteEmail')?.focus();
    return;
  }

  const { data: { session: currentSession } } =
    await db.auth.getSession();

  if(!currentSession?.access_token){
    toast('Please sign in again.');
    return;
  }

  try{
    if(button){
      button.disabled=true;
      button.textContent='Sending…';
    }
    if(status){
      status.classList.remove('hidden');
      status.textContent='Connecting to the VERZA-ALERA invitation service…';
    }

    const response = await fetch(
      SUPABASE_URL + '/functions/v1/invite-team-member',
      {
        method:'POST',
        mode:'cors',
        headers:{
          'Content-Type':'application/json',
          'Authorization':'Bearer ' + currentSession.access_token,
          'apikey':SUPABASE_KEY
        },
        body:JSON.stringify({email,role})
      }
    );

    const text = await response.text();
    let result;
    try{ result=JSON.parse(text); }
    catch{ result={error:text}; }

    if(!response.ok){
      throw new Error(result.error || result.message || 'Could not send invitation.');
    }

    await audit('team_invitation_sent','team_invitation',null,{email,role});

    if(status){
      status.textContent='✓ Invitation sent to ' + email + ' as ' + role + '.';
    }
    toast('Invitation sent to ' + email + '.');
    if($('inviteEmail')) $('inviteEmail').value='';

  }catch(error){
    console.error('Team invitation error:',error);
    if(status){
      status.textContent='Invitation failed: ' + (error.message || 'Unknown error.');
    }
    toast(error.message || 'Could not send invitation.');
  }finally{
    if(button){
      button.disabled=false;
      button.textContent='Send invite ↗';
    }
  }
}

async function loadAudit(){

  if(!organization) return;

  const result=await db
    .from('audit_logs')
    .select('*')
    .eq('organization_id',organization.id)
    .order('created_at',{ascending:false})
    .limit(30);

  const target=$('auditContent');

  if(!target) return;

  if(result.error){

    target.innerHTML=
      `<div class="notice">${result.error.message}</div>`;

    return;
  }

  const rows=result.data || [];

  target.innerHTML=rows.length
    ? `<div class="timeline">
        ${rows.map(row=>`
          <div class="timeline-item">
            <b>${row.action}</b>
            <span>
              ${row.entity_type || ''}
              ·
              ${new Date(row.created_at).toLocaleString()}
            </span>
          </div>
        `).join('')}
       </div>`
    : `<div class="empty">
        No activity recorded yet.
       </div>`;
}

async function addLabel(){

  if(!activeProject) return;

  const label=prompt('Enter label name');

  if(!label) return;

  const labels=[
    ...(activeProject.labels || [])
  ];

  if(!labels.includes(label)){
    labels.push(label);
  }

  const result=await db
    .from('projects')
    .update({
      labels
    })
    .eq('id',activeProject.id);

  if(result.error){
    toast(result.error.message);
    return;
  }

  activeProject.labels=labels;

  const index=projects.findIndex(
    p=>p.id===activeProject.id
  );

  if(index>=0){
    projects[index]=activeProject;
  }

  toast('Label added.');
  renderPage();
}

function chatWidget(){

  return `

    <button
      class="chat-button"
      onclick="toggleChat()"
      title="Open VERZA-ALERA assistant">
      ${chatbotOpen ? '×' : '✦'}
    </button>

    <div
      class="chat-window ${chatbotOpen?'':'hidden'}"
      id="chatWindow">

      <div class="chat-header">

        <div class="chat-title">

          <div class="bot-avatar">✦</div>

          <div>
            <b>VERZA Assistant</b>
            <div class="muted"
              style="font-size:9px;margin-top:2px">
              VERZA-ALERA AI
            </div>
          </div>

        </div>

        <button
          class="btn btn-secondary"
          style="padding:5px 8px"
          onclick="toggleChat()">
          ×
        </button>

      </div>

      <div class="chat-messages" id="chatMessages">

        <div class="message bot">
          Hi! I'm the VERZA-ALERA assistant.
          How can I help you with the platform?
        </div>

      </div>

      <div class="chat-input">

        <input
          id="chatInput"
          placeholder="Ask something…"
          onkeydown="if(event.key==='Enter')sendChat()">

          class="btn btn-primary"
          style="padding:9px 12px"
          onclick="sendChat()">
          →
        </button>

      </div>

    </div>

function toggleChat(){

  chatbotOpen=!chatbotOpen;

  const window=$('chatWindow');

  if(window){
    window.classList.toggle(
      'hidden',
      !chatbotOpen
    );
  }

  const button=document.querySelector('.chat-button');

  if(button){
    button.textContent=
      chatbotOpen ? '×' : '✦';
  }
}

function sendChat(){

  const input=$('chatInput');
  const messages=$('chatMessages');
  if(!input || !messages) return;

  const text=input.value.trim();
  if(!text) return;

  const addMessage=(content,type)=>{
    const el=document.createElement('div');
    el.className='message ' + type;
    el.textContent=content;
    messages.appendChild(el);
    messages.scrollTop=messages.scrollHeight;
  };

  addMessage(text,'user');
  input.value='';

  const typing=document.createElement('div');
  typing.className='message bot';
  typing.textContent='VERZA Assistant is thinking…';
  messages.appendChild(typing);
  messages.scrollTop=messages.scrollHeight;

  setTimeout(()=>{
    let reply='I can help you navigate VERZA-ALERA AI. Ask me about projects, annotation, datasets, quality review, team invitations, WhatsApp support, or workspace settings.';
    const lower=text.toLowerCase();

    if(/\b(project|projects)\b/.test(lower)){
      reply='Projects are the core workspace units. Open Projects to create, organize and manage AI data workflows, images, labels and annotation work.';
    }else if(/\b(annotation|annotate|label|bounding)\b/.test(lower)){
      reply='Open Annotation Studio, choose an image, then create or review annotations and labels for your training-data workflow.';
    }else if(/\b(dataset|datasets|export|csv|json|yolo|coco)\b/.test(lower)){
      reply='Datasets lets you manage and prepare structured outputs for downstream AI workflows, including common JSON, CSV, YOLO and COCO-style formats.';
    }else if(/\b(quality|review|approved|rejected)\b/.test(lower)){
      reply='Quality Review is designed for monitoring submitted annotation work and separating approved, rejected and pending items.';
    }else if(/\b(invite|invitation|team|teammate|member)\b/.test(lower)){
      reply='To invite someone, open Team, enter their email, choose Annotator, Reviewer or Manager, and press Send invite. The invitation is sent through the connected Supabase Edge Function.';
    }else if(/\b(whatsapp|contact|support)\b/.test(lower)){
      reply='Use the green WhatsApp button at the bottom-right to contact VERZA-ALERA AI directly.';
    }else if(/\b(sign in|login|log in|signup|sign up|account)\b/.test(lower)){
      reply='Use Sign In for an existing account or Get Started to create a new VERZA-ALERA workspace account. Email verification may be required.';
    }else if(/\b(hello|hi|hey)\b/.test(lower)){
      reply='Hello! Welcome to VERZA-ALERA AI. What would you like to explore?';
    }

    typing.remove();
    addMessage(reply,'bot');
  },520);
}

/* Visual motion / reveal system */
function initVisualMotion(){
  const items=document.querySelectorAll('.reveal');
  if(!('IntersectionObserver' in window)){ items.forEach(el=>el.classList.add('is-visible')); return; }
  const io=new IntersectionObserver(entries=>{
    entries.forEach(entry=>{ if(entry.isIntersecting){ entry.target.classList.add('is-visible'); io.unobserve(entry.target); } });
  },{threshold:.12,rootMargin:'0px 0px -35px 0px'});
  items.forEach(el=>io.observe(el));
}

<script>

const hourHand = document.querySelector(".hour-hand");
const minuteHand = document.querySelector(".minute-hand");
const secondHand = document.querySelector(".second-hand");
const digitalClock = document.getElementById("digitalClock");
const clockLocation = document.getElementById("clockLocation");

function updateClock(){

    const now = new Date();

    const seconds =
      now.getSeconds() + now.getMilliseconds()/1000;

    const minutes =
      now.getMinutes() + seconds/60;

    const hours =
      (now.getHours()%12) + minutes/60;

    const secondDeg = seconds * 6;
    const minuteDeg = minutes * 6;
    const hourDeg = hours * 30;

    hourHand.style.transform =
      `translateX(-50%) rotate(${hourDeg}deg)`;

    minuteHand.style.transform =
      `translateX(-50%) rotate(${minuteDeg}deg)`;

    secondHand.style.transform =
      `translateX(-50%) rotate(${secondDeg}deg)`;

    digitalClock.textContent =
      now.toLocaleTimeString();

    clockLocation.textContent =
      Intl.DateTimeFormat()
      .resolvedOptions()
      .timeZone;
}
})();

</script>
